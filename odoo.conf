; Default config of the image, for running it by hand. On the VPS every
; client mounts its own (provision-client.sh writes it with its database,
; credentials and a random master password).
[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
list_db = False
proxy_mode = True
